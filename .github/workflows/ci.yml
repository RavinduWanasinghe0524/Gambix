# =============================================================================
#  Gambix v2 — CI Pipeline
#  Runs on every push and PR to `develop` and `main`.
#
#  Jobs (in dependency order):
#    lint     → ruff + mypy
#    test     → pytest + coverage
#    mutation → mutmut on gambix/symbolic/ (PRs only, expensive)
#
#  Hard-fail gates:
#    - Coverage < 85%
#    - Any perft node-count mismatch   (test_perft marker)
#    - Detector precision drop > 1pt   (test_detector marker)
#    - Verifier catch rate < 99%        (test_verifier marker)
#    - Tier C raw data in release folder
# =============================================================================

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint — ruff + mypy
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff (lint + format check)
        run: ruff check . && ruff format --check .

      - name: Run mypy (strict type checking)
        run: mypy gambix/

  # ---------------------------------------------------------------------------
  # Job 2: Test — pytest + coverage + CI gates
  # ---------------------------------------------------------------------------
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Stockfish
        run: |
          wget -q https://github.com/official-stockfish/Stockfish/releases/download/sf_17/stockfish-ubuntu-x86-64-avx2.tar
          tar -xf stockfish-ubuntu-x86-64-avx2.tar
          sudo mv stockfish/stockfish-ubuntu-x86-64-avx2 /usr/local/bin/stockfish
          sudo chmod +x /usr/local/bin/stockfish
          stockfish --version

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: pytest --cov=gambix --cov-report=xml --cov-fail-under=85

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't block CI on upload failure

      # --- CI Gate: Tier C data check ---
      - name: Check no Tier C data in release folder
        run: |
          if [ -f "data/MANIFEST.jsonl" ]; then
            python scripts/ci/check_licence_tiers.py
          else
            echo "No MANIFEST.jsonl yet — skipping licence check."
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Mutation Testing — only on PRs (expensive, skip on push to develop)
  # ---------------------------------------------------------------------------
  mutation:
    name: Mutation Testing (symbolic/)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run mutmut on gambix/symbolic/
        run: |
          mutmut run --paths-to-mutate gambix/symbolic/ --tests-dir tests/symbolic/
          mutmut results

      - name: Enforce mutation score > 80%
        run: python scripts/ci/check_mutation_score.py

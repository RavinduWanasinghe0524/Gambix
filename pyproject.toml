[project]
name = "gambix"
version = "2.0.0"
description = "A Verified, Engine-Grounded, Graph-Neural Chess Explanation System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gambix Contributors" }]
keywords = ["chess", "explainability", "gnn", "stockfish", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.11",
  "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
  # Chess logic
  "python-chess>=1.999",
  # Engine interface
  "stockfish>=3.28",
  # Data validation / schemas
  "pydantic>=2.7",
  # API layer
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  # LLM constrained decoding
  "outlines>=0.0.40",
  # Data storage / caching
  "duckdb>=0.10",
  # UI
  "gradio>=4.0",
  # Data processing
  "pandas>=2.0",
  "pyarrow>=14.0",
  "zstandard>=0.22",   # for .zst Lichess dumps
]

[project.optional-dependencies]
# Install ML stack separately:
#   pip install -e ".[ml]"
ml = [
  "torch>=2.3",
  "torch-geometric>=2.5",
  "captum>=0.7",
  "mlflow>=2.13",
]

dev = [
  # Testing
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  # Type checking
  "mypy>=1.10",
  # Linting / formatting
  "ruff>=0.4",
  # Mutation testing
  "mutmut>=3.1",
  # Browser UI testing
  "playwright>=1.44",
  # Type stubs
  "types-requests>=2.32",
]

[project.scripts]
gambix = "gambix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "ANN", # flake8-annotations (type hints)
  "N",   # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]   # don't require annotations in tests

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
  "--cov=gambix",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
  "--timeout=120",
  "-v",
]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["gambix"]
omit = ["tests/*", "scripts/*", "ui/*", "client/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85

# ---------------------------------------------------------------------------
# Mutmut — mutation testing (runs only on symbolic detectors)
# ---------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = "gambix/symbolic/"
tests_dir = "tests/symbolic/"
